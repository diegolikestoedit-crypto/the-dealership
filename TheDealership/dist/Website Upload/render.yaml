# Render.com blueprint: free web service running The Dealership.
services:
  - type: web
    name: the-dealership
    runtime: python
    plan: free
    buildCommand: "echo 'No dependencies to install'"
    startCommand: "python3 server/server.py --no-browser"
    healthCheckPath: /api/info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEALERSHIP_DATA
        value: /tmp/thedealership
